log_level: INFO
log_file: logs/realtec_vision.log
streaming:
  source_type: usb
  video_path: videos/Colcha.mp4
  usb_camera_index: 0
  rtsp_url: ''
  gige_ip: ''
  gige_port: 3956
  gentl_cti_path: ''
  gentl_device_index: 0
  gentl_max_dimension: 1920
  gentl_target_fps: 4.0
  max_frame_buffer_size: 30
  loop_video: true
detection:
  model_path: model_best
  default_model: model_best
  # confidence_threshold é aplicado por post_process_instance_segmentation do
  # Mask2Former. Valores típicos do estado da arte: 0.5 (default) a 0.7.
  # Subir para 0.71 só com cena bem controlada e iluminação calibrada — caso
  # contrário, todas as queries reais ficam abaixo do corte e o sistema
  # silencia. Use os logs "inference_diagnostic" (INFO) para calibrar.
  confidence_threshold: 0.5
  max_detections: 10
  target_classes:
    - Embalagem
  inference_fps: 4
  device: auto
  segmentation_mask_threshold: 0.5
  segmentation_overlap_mask_area_threshold: 0.8
  segmentation_min_mask_pixels: 64
  prioritize_area: true
  display_confidence_threshold: 0.5
  plc_confidence_threshold: 0.5
preprocess:
  profile: bright
  brightness: 0.0
  contrast: 0.0
  roi:
  - 181
  - 101
  - 277
  - 277
  roi_unit: px
  roi_calibration_mm_per_px: 10.0
# Mark2: ver config/mark2.yaml (carregado automaticamente)
output:
  rtsp_enabled: true
  http_port: 8080
  http_path: /stream
